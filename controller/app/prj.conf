# Sensor API
CONFIG_SENSOR=y

# PWM capture API
CONFIG_PWM_CAPTURE=y

# logging
CONFIG_LOG=y
CONFIG_SENSOR_LOG_LEVEL_INF=y

# misc
CONFIG_ASSERT=y
CONFIG_REBOOT=y

# CMSIS kernel
CONFIG_POLL=y
CONFIG_NUM_PREEMPT_PRIORITIES=56
CONFIG_CMSIS_RTOS_V2=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_CMSIS_V2_THREAD_DYNAMIC_MAX_COUNT=10
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_CMSIS_V2_MSGQ_MAX_DYNAMIC_SIZE=1024

# CMSIS_DSP
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_CONTROLLER=y
CONFIG_CMSIS_DSP_QUATERNIONMATH=y

# Shell
CONFIG_SHELL=y
CONFIG_SETTINGS_SHELL=y

# NVM Settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_LED=y
